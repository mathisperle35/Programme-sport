<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0b0f">
<title>Muscu</title>
<style>
:root{--bg:#0b0b0f;--card:#16161d;--card2:#1e1e28;--txt:#f4f4f7;--mut:#8b8b99;--acc:#7c5cff;--acc2:#00d4a0;--red:#ff5c6c;--line:#2a2a36}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
header{padding:20px 16px 8px}
h1{margin:0;font-size:26px}
h3{font-size:18px;margin:0 0 8px}
.sub{color:var(--mut);font-size:13px;margin-top:4px}
.wrap{padding:0 16px 16px}
.small{font-size:12px;color:var(--mut);line-height:1.5}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.exh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.exh small{color:var(--mut);font-size:12px;white-space:nowrap}
.tip{font-size:12px;color:var(--mut);margin:4px 0 8px;line-height:1.4}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.badge{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:3px 8px;font-size:11px;color:var(--mut)}
.hint{font-size:12px;color:var(--acc2);margin:6px 0}
.hint.w{color:var(--red)}
.row{display:grid;grid-template-columns:24px 1fr 1fr 44px;gap:6px;align-items:center;margin:6px 0}
.row i{font-style:normal;color:var(--mut);font-size:12px;text-align:center}
input{width:100%;background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:16px;outline:none}
input:focus{border-color:var(--acc)}
.chk{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--mut);font-size:18px}
.chk.on{background:var(--acc2);color:#000;border-color:var(--acc2)}
.btn{width:100%;padding:14px;border:0;border-radius:12px;background:var(--acc);color:#fff;font-size:16px;font-weight:600;margin-top:8px}
.btn.ghost{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
.btn.r{background:var(--red)}
.sel{display:block;width:100%;text-align:left;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;color:var(--txt);margin-bottom:10px;font-size:16px}
.sel b{display:block;font-size:17px}
.sel small{color:var(--mut);font-size:12px}
.tabs-s{display:flex;gap:8px;overflow-x:auto;padding:0 16px 8px}
.tabs-s button{flex:0 0 auto;background:var(--card2);color:var(--mut);border:1px solid var(--line);border-radius:20px;padding:8px 14px;font-size:13px}
.tabs-s button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.edit{display:grid;grid-template-columns:1fr 50px 70px 36px;gap:6px;margin:6px 0}
.edit input{padding:10px 6px;font-size:15px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:10px 0;font-size:11px}
nav button span{display:block;font-size:20px;margin-bottom:2px}
nav button.on{color:var(--acc)}
canvas{width:100%;height:160px;display:block;margin:8px 0}
.back{background:none;border:0;color:var(--acc);font-size:16px;padding:12px 16px}
</style>
</head>
<body>
<div id="app"></div>
<nav>
<button data-t="train" class="on"><span>🏋️</span>Séances</button>
<button data-t="prog"><span>📈</span>Progrès</button>
<button data-t="body"><span>⚖️</span>Poids</button>
<button data-t="set"><span>⚙️</span>Réglages</button>
</nav>
<script>
/* ===== DONNÉES PAR DÉFAUT (4 séances : Haut A, Bas A, Haut B, Bas B) ===== */
const DEFAULT={
  days:[
    {name:"Haut A",ex:[
      {n:"Développé couché",s:4,r:"6-8",inc:2.5,tempo:"3-1-1",rpe:8,rest:"2-3 min",tip:"Omoplates serrées, pieds au sol, barre au bas de la poitrine."},
      {n:"Tirage vertical poulie",s:4,r:"8-10",inc:2.5,tempo:"2-1-1",rpe:8,rest:"2 min",tip:"Tire la barre vers le haut de la poitrine, poitrine haute."},
      {n:"Développé incliné haltères",s:3,r:"8-10",inc:2,tempo:"3-1-1",rpe:8,rest:"2 min",tip:"Banc à 30°, descends lentement, coudes à ~45°."},
      {n:"Rowing machine",s:3,r:"8-10",inc:2.5,tempo:"2-1-1",rpe:8,rest:"2 min",tip:"Dos droit, tire vers le nombril, serre les omoplates."},
      {n:"Élévations latérales",s:3,r:"12-15",inc:1,tempo:"2-1-2",rpe:9,rest:"60 s",tip:"Coude légèrement fléchi, monte jusqu'à l'épaule."},
      {n:"Crunch à la poulie",s:4,r:"12-15",inc:2.5,tempo:"2-1-2",rpe:9,rest:"60 s",tip:"Enroule le buste vers le sol, ne tire pas avec les bras."}]},
    {name:"Bas A",ex:[
      {n:"Presse à cuisses",s:4,r:"8-10",inc:5,tempo:"3-0-1",rpe:8,rest:"2-3 min",tip:"Pieds largeur d'épaules, descends jusqu'à ~90°."},
      {n:"Soulevé de terre roumain",s:3,r:"8-10",inc:2.5,tempo:"3-1-1",rpe:8,rest:"2-3 min",tip:"Jambes presque tendues, bassin recule, dos droit."},
      {n:"Leg curl",s:3,r:"10-12",inc:2.5,tempo:"3-1-1",rpe:9,rest:"90 s",tip:"Contrôle la descente, bassin plaqué sur le banc."},
      {n:"Mollets debout",s:4,r:"12-15",inc:2.5,tempo:"2-1-1",rpe:9,rest:"60 s",tip:"Amplitude complète, pause en haut."},
      {n:"Relevé de jambes",s:4,r:"12-15",inc:0,tempo:"2-1-2",rpe:9,rest:"60 s",tip:"Bassin qui se relève, pas d'élan."}]},
    {name:"Haut B",ex:[
      {n:"Développé militaire haltères",s:4,r:"6-8",inc:2,tempo:"2-1-1",rpe:8,rest:"2-3 min",tip:"Assis, dos calé, pousse sans cambrer."},
      {n:"Tirage poitrine prise serrée",s:4,r:"10-12",inc:2.5,tempo:"2-1-2",rpe:8,rest:"90 s",tip:"Prise neutre, tire vers le bas de la poitrine."},
      {n:"Développé incliné machine",s:3,r:"10-12",inc:2.5,tempo:"3-0-1",rpe:8,rest:"2 min",tip:"Épaules basses, poussée contrôlée."},
      {n:"Rowing haltère",s:3,r:"8-10",inc:2,tempo:"2-1-1",rpe:8,rest:"2 min",tip:"Tire le coude vers le plafond, dos plat."},
      {n:"Face pull",s:3,r:"12-15",inc:2.5,tempo:"2-1-2",rpe:9,rest:"60 s",tip:"Tire vers le visage, coudes hauts."},
      {n:"Gainage",s:3,r:"30-45",inc:0,tempo:"—",rpe:8,rest:"60 s",tip:"Corps aligné, abdos serrés.",time:true}]},
    {name:"Bas B",ex:[
      {n:"Goblet squat haltère",s:4,r:"8-10",inc:2,tempo:"3-1-1",rpe:8,rest:"2-3 min",tip:"Haltère contre la poitrine, dos droit, talons au sol."},
      {n:"Fentes marchées",s:3,r:"10-12",inc:2,tempo:"2-0-1",rpe:8,rest:"90 s",tip:"Genou arrière proche du sol, buste droit."},
      {n:"Leg extension",s:3,r:"12-15",inc:2.5,tempo:"2-1-2",rpe:9,rest:"60 s",tip:"Pause en haut, descends lentement."},
      {n:"Mollets assis",s:4,r:"12-15",inc:2.5,tempo:"2-1-1",rpe:9,rest:"60 s",tip:"Amplitude complète, pause en bas."},
      {n:"Crunch à la poulie",s:3,r:"12-15",inc:2.5,tempo:"2-1-2",rpe:9,rest:"60 s",tip:"Enroule le buste, contraction des abdos."}]}
  ],
  logs:[],body:[]
};

/* ===== ÉTAT & STOCKAGE ===== */
const STORE="muscu_v3";
let S;
try{S=JSON.parse(localStorage.getItem(STORE))||null}catch(e){S=null}
if(!S||!S.days)S=JSON.parse(JSON.stringify(DEFAULT));
const save=()=>localStorage.setItem(STORE,JSON.stringify(S));
let tab="train",view=null,draft=null;

/* ===== UTILITAIRES ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&","<":"<",">":">",'"':"""}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const maxRep=r=>{const m=String(r).match(/(\d+)\s*$/);return m?+m[1]:10};
const minRep=r=>{const m=String(r).match(/^(\d+)/);return m?+m[1]:6};

/* ===== PROGRESSION ===== */
function lastLog(day,exName){
  for(let i=S.logs.length-1;i>=0;i--){
    const l=S.logs[i];
    if(l.day===day){const e=l.ex.find(x=>x.n===exName);if(e)return{date:l.date,sets:e.sets}}
  }
  return null;
}
function suggestion(dayIdx,ex){
  const last=lastLog(S.days[dayIdx].name,ex.n);
  if(!last)return{w:"",msg:"Première fois : choisis une charge qui te laisse 1-2 reps en réserve (RPE "+ex.rpe+").",warn:false};
  const done=last.sets.filter(s=>s.ok);
  const w=Math.max(...last.sets.map(s=>+s.w||0));
  const top=maxRep(ex.r);
  const all=done.length===ex.s&&done.every(s=>+s.r>=top&&+s.w>=w);
  if(all)return{w:+(w+(ex.inc||0)).toFixed(2),msg:"Objectif atteint la dernière fois → +"+(ex.inc||0)+" kg",warn:false};
  const bad=done.length<ex.s||done.some(s=>+s.r<minRep(ex.r));
  if(bad)return{w:w,msg:"Garde "+w+" kg et vise plus de reps",warn:true};
  return{w:w,msg:"Garde "+w+" kg, atteins "+top+" reps sur toutes les séries",warn:false};
}
function stagnation(dayName,exName){
  const arr=[];
  for(let i=S.logs.length-1;i>=0&&arr.length<3;i--){
    const l=S.logs[i];
    if(l.day===dayName){const e=l.ex.find(x=>x.n===exName);if(e)arr.push(Math.max(...e.sets.map(s=>+s.w||0)))}
  }
  return arr.length===3&&arr.every(v=>v===arr[0]);
}

/* ===== RENDU ===== */
function render(){
  const app=$("#app");
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===tab));
  if(view!==null&&draft)app.innerHTML=viewDay();
  else if(tab==="train")app.innerHTML=viewTrain();
  else if(tab==="prog")app.innerHTML=viewProg();
  else if(tab==="body")app.innerHTML=viewBody();
  else app.innerHTML=viewSet();
  if(tab==="body")drawBody();
  if(tab==="prog"&&view!==null)drawProg();
}

function viewTrain(){
  let h='<header><h1>Séances</h1><div class="sub">Choisis ta séance du jour</div></header><div class="wrap">';
  S.days.forEach((d,i)=>{
    const last=[...S.logs].reverse().find(l=>l.day===d.name);
    h+='<button class="sel" onclick="startDay('+i+')"><b>'+esc(d.name)+'</b><small>'+d.ex.length+' exercices'+(last?' · dernière : '+last.date:'')+'</small></button>';
  });
  return h+'</div>';
}
function startDay(i){
  view=i;
  draft=S.days[i].ex.map((e,ei)=>{
    const sg=suggestion(i,e);
    return{n:e.n,sets:Array.from({length:e.s},()=>({w:sg.w,r:"",ok:false}))};
  });
  tab="train";
  render();window.scrollTo(0,0);
}
function viewDay(){
  const d=S.days[view];
  let h='<button class="back" onclick="closeDay()">← Retour</button><header><h1>'+esc(d.name)+'</h1><div class="sub">Valide chaque série au fur et à mesure</div></header><div class="wrap">';
  d.ex.forEach((ex,ei)=>{
    const sg=suggestion(view,ex);
    const st=stagnation(d.name,ex.n);
    h+='<div class="card">';
    h+='<div class="exh"><b>'+esc(ex.n)+'</b><small>'+ex.s+' × '+esc(ex.r)+'</small></div>';
    h+='<div class="meta"><span class="badge">Tempo '+esc(ex.tempo)+'</span><span class="badge">RPE '+ex.rpe+'</span><span class="badge">Repos '+esc(ex.rest)+'</span></div>';
    h+='<div class="tip">💡 '+esc(ex.tip)+'</div>';
    h+='<div class="hint'+(sg.warn?' w':'')+'">'+esc(sg.msg)+'</div>';
    if(st)h+='<div class="hint w">⚠️ Stagnation sur 3 séances : pense à changer de variante ou à te reposer plus</div>';
    h+='<div class="row" style="color:var(--mut);font-size:11px"><i>#</i><i>kg</i><i>reps</i><i></i></div>';
    draft[ei].sets.forEach((s,si)=>{
      h+='<div class="row"><i>'+(si+1)+'</i>'+
      '<input type="number" inputmode="decimal" step="0.5" value="'+s.w+'" onchange="upd('+ei+','+si+',\'w\',this.value)">'+
      '<input type="number" inputmode="numeric" value="'+s.r+'" onchange="upd('+ei+','+si+',\'r\',this.value)">'+
      '<button class="chk'+(s.ok?' on':'')+'" onclick="tog('+ei+','+si+')">✓</button></div>';
    });
    h+='</div>';
  });
  h+='<button class="btn" onclick="finish()">Terminer la séance</button></div>';
  return h;
}
function upd(e,s,k,v){draft[e].sets[s][k]=v}
function tog(e,s){
  const x=draft[e].sets[s];
  if(!x.ok&&(x.w===""||x.r===""||x.r===undefined)){alert("Remplis le poids et les reps avant de valider.");return}
  x.ok=!x.ok;render();
}
function closeDay(){
  if(draft&&draft.some(e=>e.sets.some(s=>s.ok))&&!confirm("Quitter sans enregistrer ?"))return;
  view=null;draft=null;render();
}
function finish(){
  const ex=draft.map(e=>({n:e.n,sets:e.sets.filter(s=>s.ok).map(s=>({w:+s.w,r:+s.r,ok:true}))})).filter(e=>e.sets.length);
  if(!ex.length){alert("Valide au moins une série.");return}
  S.logs.push({date:today(),day:S.days[view].name,ex});
  save();view=null;draft=null;render();
  alert("Séance enregistrée 💪");
}

/* ===== PROGRÈS ===== */
let progDay=0,progEx=0;
function viewProg(){
  const d=S.days[progDay];
  let h='<header><h1>Progrès</h1><div class="sub">Charge max par séance</div></header><div class="wrap">';
  h+='<div class="tabs-s">';
  S.days.forEach((x,i)=>h+='<button class="'+(i===progDay?'on':'')+'" onclick="setProgDay('+i+')">'+esc(x.name)+'</button>');
  h+='</div>';
  h+='<div class="card"><div class="tabs-s" style="padding:0 0 8px;overflow-x:auto">';
  d.ex.forEach((e,i)=>h+='<button class="'+(i===progEx?'on':'')+'" onclick="setProgEx('+i+')">'+esc(e.n)+'</button>');
  h+='</div><canvas id="cp"></canvas><div class="small" id="pinfo">Aucune donnée</div></div></div>';
  return h;
}
function setProgDay(i){progDay=i;progEx=0;render()}
function setProgEx(i){progEx=i;render()}
function drawProg(){
  const c=$("#cp");if(!c)return;
  const d=S.days[progDay],ex=d.ex[progEx];
  const pts=S.logs.filter(l=>l.day===d.name).map(l=>{const e=l.ex.find(x=>x.n===ex.n);return e?{d:l.date,w:Math.max(...e.sets.map(s=>+s.w||0))}:null}).filter(Boolean);
  const dpr=window.devicePixelRatio||1,W=c.clientWidth,H=c.clientHeight;
  c.width=W*dpr;c.height=H*dpr;const x=c.getContext("2d");x.scale(dpr,dpr);
  x.clearRect(0,0,W,H);
  if(pts.length<2){$("#pinfo").textContent=pts.length?"Une seule séance enregistrée":"Aucune donnée";return}
  const v=pts.map(p=>p.w),min=Math.min(...v)-1,max=Math.max(...v)+1;
  x.strokeStyle="#7c5cff";x.lineWidth=3;x.beginPath();
  pts.forEach((p,i)=>{const px=20+i*(W-40)/(pts.length-1),py=H-20-(p.w-min)/(max-min)*(H-40);i?x.lineTo(px,py):x.moveTo(px,py)});
  x.stroke();
  const d2=v[v.length-1]-v[0];
  $("#pinfo").textContent="Départ "+v[0]+" kg → "+v[v.length-1]+" kg ("+(d2>=0?"+":"")+d2.toFixed(1)+" kg)";
}

/* ===== POIDS ===== */
function viewBody(){
  const last=S.body.length?S.body[S.body.length-1]:null;
  return '<header><h1>Poids</h1><div class="sub">Pèse-toi le matin à jeun, même conditions</div></header><div class="wrap">'+
  '<div class="card"><input id="bw" type="number" inputmode="decimal" step="0.1" placeholder="Ton poids (kg)"><button class="btn" onclick="addW()">Enregistrer aujourd\'hui</button></div>'+
  '<div class="card"><h3>Évolution</h3><canvas id="cb"></canvas><div class="small" id="binfo">'+(last?'Dernier : '+last.w+' kg ('+last.d+')':'Aucune pesée')+'</div></div></div>';
}
function addW(){
  const v=parseFloat($("#bw").value);
  if(!v||v<30||v>250){alert("Poids invalide.");return}
  S.body=S.body.filter(b=>b.d!==today());S.body.push({d:today(),w:v});save();render();
}
function drawBody(){
  const c=$("#cb");if(!c||S.body.length<2)return;
  const dpr=window.devicePixelRatio||1,W=c.clientWidth,H=c.clientHeight;
  c.width=W*dpr;c.height=H*dpr;const x=c.getContext("2d");x.scale(dpr,dpr);
  const v=S.body.map(b=>b.w),min=Math.min(...v)-1,max=Math.max(...v)+1;
  x.strokeStyle="#00d4a0";x.lineWidth=3;x.beginPath();
  S.body.forEach((b,i)=>{const px=20+i*(W-40)/(S.body.length-1),py=H-20-(b.w-min)/(max-min)*(H-40);i?x.lineTo(px,py):x.moveTo(px,py)});
  x.stroke();
  const d=v[v.length-1]-v[0];
  $("#binfo").textContent="Départ "+v[0]+" kg → "+v[v.length-1]+" kg ("+(d>=0?"+":"")+d.toFixed(1)+" kg)";
}

/* ===== RÉGLAGES ===== */
function viewSet(){
  let h='<header><h1>Réglages</h1><div class="sub">Modifie ton programme</div></header><div class="wrap">';
  S.days.forEach((d,di)=>{
    h+='<div class="card"><h3>'+esc(d.name)+'</h3><div class="edit small"><span>Exercice</span><span>Séries</span><span>Reps</span><span></span></div>';
    d.ex.forEach((e,ei)=>{
      h+='<div class="edit"><input value="'+esc(e.n)+'" onchange="ed('+di+','+ei+',\'n\',this.value)">'+
      '<input type="number" value="'+e.s+'" onchange="ed('+di+','+ei+',\'s\',this.value)">'+
      '<input value="'+esc(e.r)+'" onchange="ed('+di+','+ei+',\'r\',this.value)">'+
      '<button class="chk" onclick="delEx('+di+','+ei+')">✕</button></div>';
    });
    h+='<button class="btn ghost" onclick="addEx('+di+')">+ Ajouter un exercice</button></div>';
  });
  h+='<div class="card"><h3>Données</h3><button class="btn ghost" onclick="exp()">Exporter (copier)</button><button class="btn r" onclick="reset()">Tout effacer</button></div>';
  return h+'</div>';
}
function ed(d,e,k,v){
  if(k==="s"){v=parseInt(v);if(!v||v<1||v>10){alert("Séries entre 1 et 10");render();return}}
  S.days[d].ex[e][k]=v;save();
}
function delEx(d,e){if(confirm("Supprimer cet exercice ?")){S.days[d].ex.splice(e,1);save();render()}}
function addEx(d){S.days[d].ex.push({n:"Nouvel exercice",s:3,r:"8-12",inc:2.5,tempo:"2-1-1",rpe:8,rest:"90 s",tip:"Précise la technique."});save();render()}
function exp(){
  const t=JSON.stringify(S);
  if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>alert("Copié ! Colle-le dans Notes pour le garder."));
  else prompt("Copie ce texte :",t);
}
function reset(){
  if(confirm("Effacer TOUTES tes données ?")){
    localStorage.removeItem(STORE);S=JSON.parse(JSON.stringify(DEFAULT));view=null;draft=null;render();
  }
}

/* ===== NAVIGATION ===== */
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;view=null;draft=null;render();window.scrollTo(0,0)});
render();
</script>
</body>
</html>
